<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
    <defs>
        <linearGradient id="aurevia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8"/>
            <stop offset="60%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#4f46e5"/>
        </linearGradient>
        <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Emblem Crest Icon -->
    <g transform="translate(6, 4)">
        <!-- Outer Academic Shield -->
        <path d="M20 2 L36 9 V22 C36 31 29 37 20 40 C11 37 4 31 4 22 V9 Z" 
              fill="url(#aurevia-grad)" opacity="0.95"/>
        
        <!-- Inner Arch & Gateway (Campus Connectivity) -->
        <path d="M20 9 L31 14.5 V22 C31 28 26.5 32.5 20 34.5 C13.5 32.5 9 28 9 22 V14.5 Z" 
              fill="#0b1325" opacity="0.85"/>
        
        <!-- Central Chevron / Keystone Pillar -->
        <path d="M20 13 L26 19 H22 V27 H18 V19 H14 Z" fill="url(#gold-accent)"/>
        
        <!-- Radiant Star Apex -->
        <circle cx="20" cy="8" r="2" fill="#ffffff" filter="url(#glow)"/>
    </g>

    <!-- Wordmark Typography -->
    <text x="56" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="800" font-size="20" letter-spacing="-0.5" fill="#f8fafc">
        Aurevia
    </text>
    <text x="135" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="600" font-size="14" letter-spacing="1.2" fill="#818cf8" text-transform="uppercase">
        CAMPUS
    </text>
    
    <!-- Subtle Subtitle Tagline -->
    <text x="56" y="39" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-weight="500" font-size="8" letter-spacing="0.8" fill="#94a3b8">
        COLLEGE OPERATIONS SAAS
    </text>
</svg>
