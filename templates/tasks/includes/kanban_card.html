<div class="card shadow-sm p-3 border kanban-task-card" draggable="true" data-task-id="{{ task.id }}" style="background-color: var(--bg-secondary); border-color: var(--border-color) !important;">
    <div class="d-flex justify-content-between align-items-start mb-2">
        <!-- Priority Badge -->
        <span class="badge {% if task.priority == 'high' %}bg-danger-subtle text-danger{% elif task.priority == 'medium' %}bg-warning-subtle text-warning{% else %}bg-info-subtle text-info{% endif %} rounded-pill text-xs px-2 py-1">
            {{ task.get_priority_display }}
        </span>
        <!-- Actions Dropdown -->
        <div class="dropdown">
            <button class="btn btn-sm btn-link text-muted p-0" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-three-dots-vertical"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item small" href="{% url 'task_edit' task.pk %}"><i class="bi bi-pencil me-1"></i> Edit</a></li>
                <li><a class="dropdown-item small text-danger" href="{% url 'task_delete' task.pk %}"><i class="bi bi-trash me-1"></i> Delete</a></li>
            </ul>
        </div>
    </div>
    
    <!-- Title and Description -->
    <h6 class="fw-bold text-body mb-1">{{ task.title }}</h6>
    <p class="text-secondary small mb-2" style="font-size: 0.8rem;">
        {% if task.description %}
            {{ task.description|truncatewords:8 }}
        {% else %}
            <span class="fst-italic text-muted opacity-50">No description</span>
        {% endif %}
    </p>
    
    <!-- Footer metadata -->
    <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top" style="border-top-color: var(--border-color) !important;">
        <small class="text-primary fw-600" style="font-size: 0.75rem;">{{ task.project.title }}</small>
        <div class="d-flex align-items-center">
            {% if task.assignee %}
                <img src="https://ui-avatars.com/api/?name={{ task.assignee.username }}&background=6366f1&color=fff" alt="Assignee" width="20" height="20" class="rounded-circle" title="{{ task.assignee.username }}">
            {% else %}
                <span class="text-muted text-xs">Unassigned</span>
            {% endif %}
        </div>
    </div>
</div>
