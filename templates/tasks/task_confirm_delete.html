{% extends 'base.html' %}

{% block title %}Delete Task | Aurevia Campus{% endblock %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-6">
        <div class="card shadow border-0">
            <div class="card-body p-5 text-center">
                <div class="text-warning mb-4">
                    <i class="bi bi-trash3-fill fs-1"></i>
                </div>
                <h4 class="fw-bold mb-3">Remove Task?</h4>
                <p class="text-muted mb-4">Are you sure you want to delete the task: <strong>{{ object.title }}</strong> from <strong>{{ object.project.title }}</strong>?</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger py-2 fw-bold">Delete Task</button>
                        <a href="{% url 'task_list' %}" class="btn btn-light py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
